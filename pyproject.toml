[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nptel-question-bank-generator"
version = "0.1.0"
description = "Universal open-source tool to convert educational lecture PDFs into structured, psychometrically validated MCQ question banks and learning roadmaps."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Open Lecture Bank Contributors" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education :: Testing",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
keywords = ["nptel", "pdf-extraction", "mcq-generator", "question-bank", "educational-technology", "curriculum-learning"]
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.23.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/mugenkyou/nptel-question-bank-generator"
Repository = "https://github.com/mugenkyou/nptel-question-bank-generator.git"
Issues = "https://github.com/mugenkyou/nptel-question-bank-generator/issues"

[project.optional-dependencies]
ui = [
    "streamlit>=1.29.0"
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "flake8>=6.1.0",
    "black>=23.11.0",
    "mypy>=1.7.0"
]

[project.scripts]
nptel-question-bank-generator = "open_lecture_bank.cli:main"
open-lecture-bank = "open_lecture_bank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.black]
line-length = 100
target-version = ["py310"]
